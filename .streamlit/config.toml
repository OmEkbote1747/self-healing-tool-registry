[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
linkColor = "#1D4ED8"
borderColor = "#DCE3EE"
showWidgetBorder = true
baseFontSize = 16
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
headingFontWeights = [750, 700, 650, 600, 600, 600]
codeFontSize = "0.85rem"
dataframeHeaderBackgroundColor = "#EEF2F8"

[theme.sidebar]
backgroundColor = "#0B1B36"
secondaryBackgroundColor = "#13284D"
textColor = "#E2E8F0"
borderColor = "#1E3A66"

[client]
toolbarMode = "minimal"
